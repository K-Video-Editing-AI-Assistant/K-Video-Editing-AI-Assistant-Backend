[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-assistant"
version = "1.2.0"
description = "AI 영상편집 어시스턴트 multi-video single-process Python application skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.40,<2",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
# bootstrap.py lives directly in src/, outside the five packages.
py-modules = ["bootstrap"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
