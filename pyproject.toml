[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-assistant-skeleton"
version = "0.1.0"
description = "Stub-driven AI video editing assistant starter project"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "streamlit>=1.41,<2", "python-dotenv>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27,<1"]
deploy = ["fastapi[standard]>=0.115,<1", "fastapi-cloud-cli>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "video_assistant.api.app:app"
