[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipnote-video-assistant"
version = "1.2.0"
description = "CLIPNOTE multi-video single-process Python application skeleton"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
# bootstrap.py lives directly in src/, outside the five packages.
py-modules = ["bootstrap"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
