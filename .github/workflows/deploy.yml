name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keep an active deployment running to completion; serialize newer releases.
concurrency:
  group: fastapi-cloud-production
  cancel-in-progress: false

jobs:
  ci:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to FastAPI Cloud
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deployment dependencies
        run: python -m pip install -e '.[deploy]'
      - name: Check deployment configuration
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: |
          if [ -z "$FASTAPI_CLOUD_TOKEN" ] || [ -z "$FASTAPI_CLOUD_APP_ID" ]; then
            echo 'Set FASTAPI_CLOUD_TOKEN and FASTAPI_CLOUD_APP_ID in repository Actions secrets.'
            exit 1
          fi
      - name: Deploy tested commit
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: fastapi deploy
